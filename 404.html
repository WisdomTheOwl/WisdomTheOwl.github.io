<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Página não encontrada · Wisdom a Coruja</title>
<meta name="theme-color" content="#15110C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--breu:#15110C;--linha:#3A3023;--pergaminho:#E8D8B4;--pergaminho-2:#B9AA88;--ouro:#C6A664;
  --titulo:"Cinzel","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --texto:"EB Garamond","Palatino Linotype","Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;color:var(--pergaminho);font:18px/1.5 var(--texto);text-align:center;
  background-color:var(--breu);
  background-image:radial-gradient(900px 520px at 50% -10%,rgba(198,166,100,.10),transparent 60%);background-repeat:no-repeat}
.retrato{display:block;width:120px;height:120px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--ouro);background:#1F1A14 url(/wis.jpg) 37% 41% / 220% auto no-repeat;filter:grayscale(.3)}
.olho{font-family:var(--titulo);color:var(--ouro);letter-spacing:.22em;font-size:14px;margin:0 0 10px}
h1{font-family:var(--titulo);font-size:clamp(28px,6vw,40px);line-height:1.12;margin:0 0 10px}
p{color:var(--pergaminho-2);max-width:38ch;margin:0 auto 26px}
a{display:inline-block;background:var(--ouro);color:var(--breu);font-weight:600;text-decoration:none;padding:14px 24px;border-radius:999px}
a:hover{background:#D4B676}
a:focus-visible{outline:2px solid #E0A030;outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="retrato" aria-hidden="true"></span>
  <p class="olho">ERRO 404</p>
  <h1>Esta página saiu da estante</h1>
  <p>O Wis procurou em todas as prateleiras e não achou o que você pediu. Os livros continuam no mesmo lugar.</p>
  <a href="/">Voltar para a estante do Wis</a>
</main>
</body>
</html>
